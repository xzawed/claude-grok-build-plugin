# Keeps the MCP server honest on every PR/push to main.
# Ubuntu: full gate including dist freshness. Windows: unit tests + typecheck
# (dist check is Linux-only to avoid CRLF noise on committed bundles).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: mcp-server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Committed bundles must match source (end users run dist/ without npm install).
      - name: Verify dist is up to date
        if: runner.os == 'Linux'
        run: |
          npm run build
          git diff --exit-code -- dist/index.js dist/hook.js
