# Keeps the MCP server honest on every PR/push to main.
# Primary platforms remain Linux/macOS; CI uses Ubuntu (same as server runtime).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: mcp-server (test · typecheck · dist)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Committed bundles must match source (end users run dist/ without npm install).
      - name: Verify dist is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/index.js dist/hook.js
