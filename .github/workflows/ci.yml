# Keeps the MCP server honest on every PR/push to main.
# Ubuntu: full gate including dist freshness. Windows: unit tests + typecheck
# (dist check is Linux-only to avoid CRLF noise on committed bundles).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-server:
    name: mcp-server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      # Dependencies' install scripts never run in CI (SonarCloud githubactions:S6505). Measured 2026-10-17
      # on win32 and Linux: the same bundles and the same test results as without the flag. The flag does
      # not stop a git or folder dependency's prepare script, so test/ci-workflow.test.ts holds the lockfile
      # to registry tarballs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # Committed bundles must match source (end users run dist/ without npm install).
      - name: Verify dist is up to date
        if: runner.os == 'Linux'
        run: |
          npm run build
          git diff --exit-code -- dist/index.js dist/hook.js
