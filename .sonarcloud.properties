# SonarQube Cloud automatic analysis reads this file from the repository's default branch, and its
# values take no wildcards (https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis).
# The default ("everything") counted the tests as main code, so this names every tracked path instead,
# mcp-server's apart from its tests, and declares the tests as tests. A new top-level path, or a new
# entry directly under mcp-server/, is analyzed only once it is listed here;
# mcp-server/test/sonarcloud-config.test.ts fails until it is. A path with white space in its name
# cannot be listed at all (the test takes no space in a value), so such a path is renamed first.
# A file in a dot folder is named on its own: the JavaScript analyzer skips a file when the listed
# folder's own name, or a name below it, starts with a dot (a folder named .github excepted; measured,
# docs/09-scope-and-residuals.md, 4 H), and .claude/tools reaches end users' disks. The check asks it
# of every file under a dot name, whatever its type.
# The price: the text rules that find hidden Unicode read a Markdown file only under such a dot name,
# so the two .claude skills left them; mcp-server/test/hiding-characters.test.ts checks every tracked
# file instead. A new file under a dot name is analyzed only once no listed entry reaches it through
# a dot name: name it here with no listed folder above it (list that folder's other entries
# instead), or list a plain folder below the dot name; sonarcloud-config.test.ts fails until then.
# mcp-server/dist is listed, but SonarJS leaves dist folders out by default, so the bundles are not
# analyzed; mcp-server/src, which they are built from, is.
# Why, and the per-issue verdicts of the 2026-10-17 review: docs/specs/2026-10-17-sonarcloud-review.md.
sonar.sources=.claude/skills/maintainer-preflight/SKILL.md,.claude/skills/repo-scope/SKILL.md,.claude/tools/accept-release.mjs,.claude/tools/mcpcall.mjs,.claude/tools/rpc-timeout.mjs,.claude-plugin/marketplace.json,.claude-plugin/plugin.json,.github/workflows/ci.yml,.github/workflows/release-tag-check.yml,.gitignore,.mcp.json,.sonarcloud.properties,agents,CHANGELOG.md,CLAUDE.md,commands,CONTRIBUTING.md,docs,examples,hooks,LICENSE,README.ko.md,README.md,SECURITY.md,skills,mcp-server/build.mjs,mcp-server/dist,mcp-server/package.json,mcp-server/package-lock.json,mcp-server/scripts,mcp-server/src,mcp-server/tsconfig.json,mcp-server/vitest.config.ts
sonar.tests=mcp-server/test
# The frozen copy of the v0.2.35 redaction that redact-floor.test.ts compares against; it is never edited.
sonar.test.exclusions=mcp-server/test/fixtures/redact-v0.2.35.ts
