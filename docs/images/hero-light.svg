<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">Grok Build for Claude Code</title>
  <desc id="d">Claude directs, Grok builds in your working tree, and your xAI subscription pays. Claude Code calls this plugin's grok-build MCP server, which runs the headless grok CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="none" stroke="#d0d7de"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="56" font-weight="700" fill="#1f2328">Grok Build for Claude Code</text>
    <text x="64" y="150" font-size="23" fill="#57606a">Claude directs. Grok builds in your working tree. Your xAI subscription pays.</text>
    <g font-size="15">
      <rect x="64" y="180" width="232" height="34" rx="17" fill="#f3e8ff" stroke="#d8b9ff"/>
      <text x="180" y="202" text-anchor="middle" fill="#6e40c9">MCP 2025 · 2026-07-28</text>
      <rect x="308" y="180" width="138" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
      <text x="377" y="202" text-anchor="middle" fill="#24292f">Node.js 20+</text>
      <rect x="458" y="180" width="236" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
      <text x="576" y="202" text-anchor="middle" fill="#24292f">subscription by default</text>
      <rect x="706" y="180" width="200" height="34" rx="17" fill="#eaeef2" stroke="#d0d7de"/>
      <text x="806" y="202" text-anchor="middle" fill="#24292f">never auto-commits</text>
    </g>
    <g>
      <rect x="64" y="252" width="320" height="72" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
      <text x="224" y="283" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">Claude Code</text>
      <text x="224" y="307" text-anchor="middle" font-size="14" fill="#57606a">orchestrator and reviewer</text>
      <line x1="390" y1="288" x2="474" y2="288" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="480" y="252" width="320" height="72" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
      <text x="640" y="283" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">grok-build MCP server</text>
      <text x="640" y="307" text-anchor="middle" font-size="14" fill="#57606a">this plugin · strips API keys by default</text>
      <line x1="806" y1="288" x2="890" y2="288" stroke="#8c959f" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="896" y="252" width="320" height="72" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
      <text x="1056" y="283" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2328">grok CLI</text>
      <text x="1056" y="307" text-anchor="middle" font-size="14" fill="#57606a">headless worker · edits in place</text>
    </g>
  </g>
</svg>
